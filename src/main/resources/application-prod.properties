# Production overrides. Every value below must come from the environment —
# there are deliberately no defaults here, so a missing variable fails at
# startup rather than silently running with a development fallback.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# NFR-06: API documentation is available in non-production profiles only.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Never leak internals to the client (6.3).
server.error.include-stacktrace=never
server.error.include-message=never

# 8.3: deployed environments default to Supabase Storage, because most
# free-tier hosts have ephemeral filesystems that discard uploads on redeploy.
# Set STORAGE_PROVIDER=local (with UPLOAD_DIR pointed at a persistent disk) if
# the deployment target does have durable storage.
app.storage.provider=${STORAGE_PROVIDER:supabase}
app.storage.supabase.url=${SUPABASE_URL:}
app.storage.supabase.service-key=${SUPABASE_SERVICE_KEY:}
app.storage.supabase.bucket=${SUPABASE_BUCKET:resumes}

logging.level.root=INFO
logging.level.com.kejelah.pencarikeje=INFO
