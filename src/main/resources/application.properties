spring.application.name=pencarikeje

# --- Server -------------------------------------------------------------
# $PORT is how most PaaS hosts (Render included) tell the container which
# port to listen on; 8080 keeps local runs unchanged.
server.port=${PORT:8080}

# --- Datasource -------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobtracker}
spring.datasource.username=${DB_USER:jobtracker}
spring.datasource.password=${DB_PASSWORD:jobtracker_dev}

# --- JPA --------------------------------------------------------------------
# Hibernate never owns the schema; Flyway does (MVP.md 5.5).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway -----------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Uploads (NFR-03: enforced at the Spring level, not only in code) --------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload.dir=${UPLOAD_DIR:./uploads}
app.upload.max-bytes=5242880

# --- Resume storage provider (8.3) -------------------------------------------
# "local" writes to app.upload.dir; needs a persistent disk. "supabase" writes
# to a Supabase Storage bucket instead, for hosts whose filesystem is wiped on
# every redeploy/restart.
app.storage.provider=${STORAGE_PROVIDER:local}
app.storage.supabase.url=${SUPABASE_URL:}
app.storage.supabase.service-key=${SUPABASE_SERVICE_KEY:}
app.storage.supabase.bucket=${SUPABASE_BUCKET:resumes}

# --- Job posting import (MVP.md IMP-01..03) ----------------------------------
# Host allowlist checked before any outbound fetch — this is the SSRF guard,
# not just a feature restriction. Comma-separated; subdomains match too.
app.job-import.allowed-domains=${JOB_IMPORT_ALLOWED_DOMAINS:linkedin.com,jobstreet.com,jobstreet.co.id,jobstreet.com.my,jobstreet.com.sg,jobstreet.com.ph,myworkdayjobs.com}
app.job-import.connect-timeout-ms=5000
app.job-import.read-timeout-ms=8000

# --- Actuator -----------------------------------------------------------
# Only /actuator/health is exposed; SecurityConfig already permits it. Used
# as the health check by container hosts (Render, Fly, etc.).
management.endpoints.web.exposure.include=health

# --- JWT (AUTH-04) ----------------------------------------------------------
# Secret must be supplied by the environment in every deployed environment.
# The fallback exists only so a fresh clone starts locally; it is not a secret.
app.jwt.secret=${JWT_SECRET:local-development-only-secret-change-me-256-bits-minimum!!}
app.jwt.expiration-seconds=${JWT_EXPIRATION:86400}

# --- CORS (7.2: explicit allow-list, no wildcards) --------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- OpenAPI (NFR-06: non-production only, see application-prod.properties) --
springdoc.swagger-ui.path=/swagger-ui.html

# --- Logging (NFR-08) -------------------------------------------------------
logging.pattern.level=%5p [${spring.application.name},%X{correlationId:-}]
